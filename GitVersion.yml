mode: Mainline
branches:
  main:
    regex: ^main$
    increment: Minor
    is-mainline: true
    prevent-increment-of-merged-branch-version: false
    tag: ''
  develop:
    increment: Patch
    is-mainline: true
    regex: ^develop$
    prevent-increment-of-merged-branch-version: false
    tag: ''

update-build-number: false
assembly-versioning-scheme: MajorMinorPatch
ignore:
  sha: []
commit-message-incrementing: Enabled

# Mainline mode bumps a merge commit by the increment of the branch its
# message names, so "Merge branch 'develop'" bumped main by Patch instead of
# Minor (1.30.0 -> 1.30.1). This format matches develop-into-main merges
# without capturing a source branch, so main's own increment applies.
merge-message-formats:
  develop-into-main: '^Merge (branch ''develop''|pull request #\d+ from [^\s/]+/develop)( into main)?(\r?\n|$)'
